<script>
/* ---------- ESP32 port (same as main page) + hidden port picker + Back button ----------
   Same baud rate and saved-port key as the main page; the port is actually
   opened and re-opened on load. The ESP32 badge follows the port. */
(function(){
  var BAUD=115200, INFO_KEY='zippySerialPortInfo';
  var supported=('serial' in navigator);
  var port=null, reader=null, loop=null, open=false, busy=false;

  window.zippyPortSupported=supported;
  window.zippyPortIsOpen=function(){return open;};

  function showState(){setConnectionIndicator(open?'online':'offline');}
  async function readLoop(p){
    while(p.readable&&port===p){
      reader=p.readable.getReader();
      try{ while(true){ var r=await reader.read(); if(r.done)break; } }catch(e){}
      finally{ try{reader.releaseLock();}catch(e){} reader=null; }
    }
    if(port===p){ try{await p.close();}catch(e){} port=null; open=false; showState(); }
  }
  async function openPort(p){
    await p.open({baudRate:BAUD});
    try{await p.setSignals({dataTerminalReady:false,requestToSend:false});}catch(e){}
    try{localStorage.setItem(INFO_KEY,JSON.stringify(p.getInfo?p.getInfo():{}));}catch(e){}
    port=p; open=true; showState();
    loop=readLoop(p);
  }
  function matchesSaved(p){
    try{
      var saved=JSON.parse(localStorage.getItem(INFO_KEY)||'{}');
      var info=p.getInfo?p.getInfo():{};
      if(!saved.usbVendorId)return true;
      return saved.usbVendorId===info.usbVendorId&&saved.usbProductId===info.usbProductId;
    }catch(e){return true;}
  }
  async function autoOpen(list){
    if(open||busy)return;
    busy=true;
    try{
      for(var i=0;i<list.length;i++){
        if(!matchesSaved(list[i]))continue;
        try{await openPort(list[i]);break;}catch(e){}
      }
    }finally{busy=false;}
  }
  window.zippyReleasePort=async function(){
    var p=port; if(!p)return;
    port=null; open=false;
    try{if(reader)await reader.cancel();}catch(e){}
    try{if(loop)await loop;}catch(e){}
    try{await p.close();}catch(e){}
  };

  /* Discreet port picker: a tiny faded button in the bottom-right corner. */
  var portBtn=document.createElement('button');
  portBtn.type='button';
  portBtn.textContent='\u2699';
  portBtn.title='Select USB port';
  portBtn.setAttribute('aria-label','Select USB port');
  portBtn.style.cssText='position:fixed;right:10px;bottom:10px;z-index:2000;width:22px;height:22px;padding:0;border:0;border-radius:50%;background:transparent;color:#5b5f63;font-size:13px;line-height:1;cursor:pointer;opacity:.18;transition:opacity .2s';
  portBtn.addEventListener('mouseenter',function(){portBtn.style.opacity='1';});
  portBtn.addEventListener('mouseleave',function(){portBtn.style.opacity='.18';});
  portBtn.addEventListener('click',async function(){
    if(!supported)return;
    if(open){await window.zippyReleasePort();showState();return;}   // click again = disconnect
    try{
      var p=await navigator.serial.requestPort();   // pick the ESP32 once
      await openPort(p);
    }catch(e){}
  });
  document.body.appendChild(portBtn);

  if(supported){
    navigator.serial.addEventListener('connect',function(e){autoOpen([e.target]);});
    navigator.serial.addEventListener('disconnect',function(e){
      if(e.target===port){var p=port;port=null;open=false;try{p.close();}catch(x){} showState();}
    });
    navigator.serial.getPorts().then(autoOpen).then(showState).catch(function(){});
  }

  /* Back button: smooth fade, same tab; port is released first so the main page can re-open it. */
  var b=document.getElementById('qtVoiceCloseBtn');
  if(b){
    var dest=b.getAttribute('data-href');
    document.documentElement.style.transition='opacity .25s ease';
    window.addEventListener('click',function(e){
      if(!(e.target&&e.target.closest&&e.target.closest('#qtVoiceCloseBtn')))return;
      e.preventDefault();
      e.stopImmediatePropagation();   // replaces the old close handler
      document.documentElement.style.opacity='0';
      var go=false;function leave(){if(go)return;go=true;window.location.href=dest;}
      var fade=new Promise(function(r){setTimeout(r,250);});
      var rel=Promise.resolve(window.zippyReleasePort()).catch(function(){});
      Promise.all([fade,rel]).then(leave);
      setTimeout(leave,1500);
    },true);
    window.addEventListener('pageshow',function(ev){if(ev.persisted)document.documentElement.style.opacity='1';});
  }
})();
</script>
