<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zippy — The Bionic Arm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#faf9f6;--panel:#f0ece2;--ink:#15181b;--ink-dim:#5b5f63;
  --rust:#c14a2e;--rust-dim:#a53f27;--line:#d8d2c2;--line-strong:#b8b09a;--green:#1f8b4c;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;overflow-x:hidden;}
::selection{background:var(--rust);color:var(--paper);}
img{max-width:100%;display:block;}
.qt-no-scroll{overflow:hidden !important;}

/* ---------- overlay / modal shell ---------- */
.qt-modal-overlay{
  position:fixed;inset:0;z-index:600;background:rgba(250,249,246,.96);
  display:flex;align-items:stretch;justify-content:stretch;padding:0;overflow:hidden;
  width:100vw;height:100vh;
}
.qt-modal{
  background:var(--paper);display:flex;flex-direction:column;overflow:hidden;
  animation:qtPop .25s ease;position:relative;
  width:100vw;height:100vh;max-width:none;max-height:none;margin:0;border:0;border-radius:0;box-shadow:none;
}
@keyframes qtPop{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
.qt-voice-shell{position:relative;display:flex;flex-direction:column;width:100%;height:100%;min-height:0;overflow:hidden;}

/* ---------- header ---------- */
.qt-voice-head{position:relative;z-index:10;flex:0 0 auto;padding:18px 24px 0;border-bottom:1px solid var(--line);background:var(--paper);}
.qt-voice-head-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;}
.qt-voice-head-title{display:flex;align-items:center;gap:12px;min-width:0;}
.qt-z-badge{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;flex-shrink:0;}
.qt-voice-head-title h4{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;color:var(--ink);}
.qt-voice-head-title span{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--green);letter-spacing:.05em;text-transform:uppercase;margin-top:2px;}
.qt-chat-close{position:relative;z-index:100;cursor:pointer;pointer-events:auto;border:1px solid var(--line-strong);background:none;color:var(--ink);width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;font-size:18px;}
.qt-chat-close:hover{border-color:var(--ink);}

/* sign-in details chip */
.zv-user{display:flex;align-items:center;gap:10px;margin-left:auto;min-width:0;padding:5px 12px 5px 6px;border:1px solid var(--line);background:#fff;}
.zv-user-av{width:30px;height:30px;border-radius:50%;overflow:hidden;background:var(--rust);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;flex-shrink:0;}
.zv-user-av img{width:100%;height:100%;object-fit:cover;}
.zv-user-txt{min-width:0;display:flex;flex-direction:column;}
.zv-user-txt b{font-family:'Space Grotesk',sans-serif;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;}
.zv-user-txt small{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;}

/* connection indicator */
.zv-connection-status{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid var(--line);background:var(--paper);color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;}
.zv-connection-dot{width:7px;height:7px;border-radius:50%;background:var(--line-strong);flex-shrink:0;}
.zv-connection-status.online{color:var(--green);border-color:rgba(31,139,76,.35);}
.zv-connection-status.online .zv-connection-dot{background:var(--green);}
.zv-connection-status.offline{color:var(--rust);border-color:rgba(193,74,46,.35);}
.zv-connection-status.offline .zv-connection-dot{background:var(--rust);}

/* ---------- tabs / panels ---------- */
.qt-voice-tabs{display:flex;}
.qt-voice-tab{flex:1;border:0;border-bottom:2px solid transparent;background:none;color:var(--ink-dim);padding:12px 8px 13px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:all .2s;white-space:nowrap;}
.qt-voice-tab:hover{color:var(--ink);}
.qt-voice-tab.active{color:var(--ink);border-bottom-color:var(--rust);}
.qt-voice-panel{display:none;flex:1;min-height:0;}
.qt-voice-panel.active{display:flex;}
#qtVoiceSpeakPanel.active{position:relative;flex:1 1 auto;width:100%;min-width:0;min-height:0;height:auto;display:block;overflow:hidden;}
#qtVoiceSpeakPanel:not(.active){display:none !important;}

.qt-voice-messages{
  position:absolute;inset:0 0 262px 0;width:100%;height:auto;min-height:0;max-height:none;
  padding:32px 56px 28px;margin:0;overflow-y:auto;overflow-x:hidden;
  display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:16px;
  box-sizing:border-box;scrollbar-width:none;-ms-overflow-style:none;scroll-behavior:smooth;
}
.qt-voice-messages::-webkit-scrollbar{display:none;width:0;height:0;}
.qt-voice-empty{display:none !important;}
.qt-voice-hint{display:none !important;}

.qt-voice-msg{
  flex:0 0 auto;width:min(84%,760px);max-width:min(84%,760px);min-width:0;margin:0 0 16px auto;box-sizing:border-box;
  align-self:flex-end;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:18px;padding:16px 18px;box-shadow:0 8px 20px -18px rgba(21,24,27,.32);
}
.qt-voice-msg.user{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.qt-voice-msg.failed{border-color:var(--rust);}
.qt-voice-msg-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px;}
.qt-voice-msg-label{font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.72;}
.qt-voice-msg-time{font-family:'IBM Plex Mono',monospace;font-size:9.5px;opacity:.62;white-space:nowrap;}
.qt-voice-audio-row{display:flex;align-items:center;gap:10px;width:100%;padding:4px 0;}
.qt-voice-play{width:34px;height:34px;border:1px solid currentColor;background:none;color:inherit;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;border-radius:50%;}
.qt-voice-play svg{width:15px;height:15px;}
.qt-voice-audio{flex:1 1 auto;width:100%;min-width:0;max-width:none;height:38px;display:block;}
.qt-voice-loader-wrap{margin-top:12px;width:100%;}
.qt-voice-loader-track{height:3px;background:rgba(184,176,154,.45);overflow:hidden;}
.qt-voice-loader-bar{height:100%;width:0;background:currentColor;transition:width .85s cubic-bezier(.16,1,.3,1);}
.qt-voice-status-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:9px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;opacity:.72;}
.qt-voice-status{letter-spacing:.05em;text-transform:uppercase;}
.qt-voice-details{margin-top:10px;border-top:1px solid rgba(184,176,154,.32);padding-top:9px;}
.qt-voice-msg.user .qt-voice-details{border-color:rgba(250,249,246,.15);}
.qt-voice-details summary{cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.qt-voice-details summary::-webkit-details-marker{display:none;}
.qt-voice-details summary::after{content:'⌄';font-size:13px;transition:transform .2s;}
.qt-voice-details[open] summary::after{transform:rotate(180deg);}
.qt-voice-detail-grid{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;margin-top:10px;font-size:10.5px;line-height:1.5;}
.qt-voice-detail-key{font-family:'IBM Plex Mono',monospace;opacity:.65;text-transform:uppercase;letter-spacing:.05em;}
.qt-voice-detail-val{overflow-wrap:anywhere;word-break:break-word;}

/* ---------- input area ---------- */
.qt-voice-input-area{
  position:absolute;left:0;right:0;bottom:0;width:100%;height:262px;min-height:262px;flex:none;margin:0;
  padding:18px 30px 24px;box-sizing:border-box;background:var(--paper);border-top:1px solid var(--line);z-index:20;
}
.qt-voice-input-shell{
  position:relative;width:min(760px,calc(100% - 80px));height:112px;min-height:112px;max-height:112px;margin:0 auto;box-sizing:border-box;
  border:1px solid var(--line-strong);background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.qt-voice-input-shell.recording{border-color:var(--ink);}
.qt-voice-wave{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;background:#fff;z-index:1;transition:opacity .2s;}
.qt-voice-input-shell.recording .qt-voice-wave{opacity:1;}
.qt-voice-mic{position:relative;z-index:3;width:68px;height:68px;border-radius:50%;border:1px solid var(--ink);background:var(--paper);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .25s;box-shadow:0 12px 26px -18px rgba(21,24,27,.55);}
.qt-voice-mic:hover{border-color:var(--rust);color:var(--rust);transform:translateY(-1px);}
.qt-voice-mic.recording{background:var(--ink);color:var(--paper);border-color:var(--ink);animation:zvMicPulse 1.35s ease-in-out infinite;}
@keyframes zvMicPulse{0%,100%{box-shadow:0 0 0 0 rgba(193,74,46,0)}50%{box-shadow:0 0 0 9px rgba(193,74,46,.10)}}
.qt-voice-mic svg{width:28px;height:28px;}
.zv-live{width:min(760px,100%);min-height:22px;margin:10px auto 0;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.qt-voice-controls{display:flex;align-items:center;justify-content:center;gap:14px;width:100%;min-height:44px;margin-top:12px;flex-wrap:wrap;}
.qt-voice-toggle{order:1;display:flex;align-items:center;gap:9px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-dim);cursor:pointer;user-select:none;}
.qt-voice-toggle input{position:absolute;opacity:0;pointer-events:none;}
.qt-voice-switch{width:38px;height:21px;border:1px solid var(--line-strong);background:var(--panel);border-radius:20px;padding:2px;display:flex;align-items:center;transition:all .2s;}
.qt-voice-switch::after{content:'';width:15px;height:15px;border-radius:50%;background:var(--ink-dim);transition:transform .2s,background .2s;}
.qt-voice-toggle input:checked+.qt-voice-switch{background:var(--ink);border-color:var(--ink);}
.qt-voice-toggle input:checked+.qt-voice-switch::after{transform:translateX(17px);background:var(--paper);}
.qt-voice-send{order:2;display:none;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:11px 18px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:all .2s;}
.qt-voice-send:hover{background:var(--rust);border-color:var(--rust);}
.qt-voice-send.show{display:inline-flex;align-items:center;justify-content:center;gap:8px;}
.qt-voice-reset{order:3;border:1px solid var(--line-strong);background:none;color:var(--ink);padding:11px 18px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:all .2s;}
.qt-voice-reset:hover{border-color:var(--ink);}
.qt-voice-input-shell.voice-warning{border-color:var(--rust) !important;box-shadow:0 0 0 1px var(--rust) !important;}

/* ---------- history ---------- */
.qt-voice-history{overflow-y:auto;min-height:0;flex:1;padding:22px 24px 28px;display:block;scrollbar-width:none;-ms-overflow-style:none;}
.qt-voice-history::-webkit-scrollbar{width:0;height:0;display:none;}
.qt-voice-history:not(.active){display:none !important;}
.qt-voice-history.active{display:block !important;position:static;width:100%;height:auto;min-height:0;overflow-y:auto;}
.qt-voice-history-list{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-bottom:20px;}
.qt-voice-history-item{border:1px solid var(--line);background:#fff;padding:13px 14px;display:flex;align-items:center;gap:12px;}
.qt-voice-history-main{flex:1;min-width:0;}
.qt-voice-history-title{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.qt-voice-history-meta{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--ink-dim);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;text-transform:uppercase;letter-spacing:.04em;}
.qt-voice-history-audio{width:min(330px,42vw);height:32px;}

/* ---------- warning toast ---------- */
#qtVoiceWarningToast{position:fixed;top:78px;right:22px;z-index:5000;max-width:min(420px,calc(100vw - 44px));padding:13px 18px;background:var(--ink);color:var(--paper);border-left:3px solid var(--rust);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.04em;line-height:1.5;box-shadow:0 16px 35px -18px rgba(21,24,27,.55);transform:translateX(calc(100% + 40px));opacity:0;pointer-events:none;transition:transform .45s cubic-bezier(.16,1,.3,1),opacity .3s ease;}
#qtVoiceWarningToast.show{transform:translateX(0);opacity:1;}

/* ---------- commands / my gestures / creator overlay ---------- */
.qt-voice-shell .zv-panel{display:none;flex-direction:column;overflow-y:auto;min-height:0;flex:1;padding:20px 24px 28px;scrollbar-width:thin;}
.qt-voice-shell .zv-panel.active{display:flex;}
.zv-wrap{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:8px;}
.zv-intro{font-family:'IBM Plex Mono',monospace;font-size:11.5px;line-height:1.7;color:var(--ink-dim);border-left:3px solid var(--rust);padding:4px 0 4px 12px;margin-bottom:6px;}
.zv-intro b,.zv-intro i{color:var(--ink);font-style:normal;}
.zv-search{width:100%;border:1px solid var(--line);background:#fff;padding:11px 13px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink);outline:none;}
.zv-search:focus{border-color:var(--ink);}
.zv-cat{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--rust);margin-top:12px;}
.zv-cat span{color:var(--ink-dim);}
.zv-row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:#fff;padding:10px 12px;}
.zv-name{flex:1;min-width:0;}
.zv-name b{display:block;font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:14px;color:var(--ink);text-transform:capitalize;}
.zv-name small{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-dim);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.zv-btns{display:flex;gap:6px;flex-shrink:0;}
.zv-run{border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:7px 14px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;flex-shrink:0;}
.zv-run:hover{background:var(--rust);border-color:var(--rust);}
.zv-run.alt{background:#fff;color:var(--ink);}
.zv-run.alt:hover{background:var(--panel);color:var(--ink);border-color:var(--ink);}
.zv-create{align-self:flex-start;border:1px solid var(--rust);background:var(--rust);color:#fff;padding:11px 20px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;}
.zv-create:hover{background:var(--rust-dim);}
.zv-empty{padding:40px 10px;text-align:center;color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;font-size:12px;}
.zv-thumb{width:46px;height:46px;object-fit:contain;background:var(--panel);border:1px solid var(--line);flex-shrink:0;}
.zv-hello{text-align:center;color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.9;padding:26px 14px;}
.zv-hello b{color:var(--ink);font-family:'Space Grotesk',sans-serif;font-size:17px;}
#zvToast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);opacity:0;pointer-events:none;z-index:100001;background:var(--ink);color:var(--paper);border-left:3px solid var(--rust);padding:11px 18px;font-family:'IBM Plex Mono',monospace;font-size:12px;max-width:min(520px,92vw);transition:all .25s;}
#zvToast.show{opacity:1;transform:translate(-50%,0);}
#zvCreatorOverlay{position:fixed;inset:0;z-index:100000;background:var(--paper);display:none;flex-direction:column;}
#zvCreatorOverlay.open{display:flex;}
.zv-cbar{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--ink);color:var(--paper);flex-shrink:0;}
.zv-cbar b{font-family:'Space Grotesk',sans-serif;font-size:15px;}
.zv-cbar span{flex:1;font-family:'IBM Plex Mono',monospace;font-size:10.5px;opacity:.7;min-width:0;}
.zv-cbar button{border:0;background:none;color:var(--paper);font-size:20px;cursor:pointer;padding:2px 8px;}
#zvCreatorFrame{flex:1;width:100%;border:0;background:var(--paper);}

@media (max-width:760px){
  .qt-voice-head{padding:15px 16px 0;}
  .qt-voice-head-row{margin-bottom:10px;}
  .zv-connection-status{padding:6px 8px;font-size:8.5px;}
  .zv-user-txt small{display:none;}
  .zv-user-txt b{max-width:90px;}
  .qt-voice-messages{inset:0 0 250px 0;padding:20px 16px 22px;}
  .qt-voice-msg{width:94%;max-width:94%;}
  .qt-voice-input-area{height:250px;min-height:250px;padding:12px 16px 18px;}
  .qt-voice-input-shell{width:100%;height:100px;min-height:100px;max-height:100px;}
  .qt-voice-history{padding:16px 14px 20px;}
  .qt-voice-history-item{align-items:flex-start;flex-direction:column;}
  .qt-voice-history-audio{width:100%;}
  .qt-voice-shell .zv-panel{padding:14px 14px 22px;}
  .zv-cbar span{display:none;}
  .zv-row{flex-wrap:wrap;}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}
</style>
<style>
.zv-back{position:relative;z-index:100;cursor:pointer;pointer-events:auto;border:1px solid var(--line-strong);background:none;color:var(--ink);text-decoration:none;padding:10px 16px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;transition:.2s;flex-shrink:0;white-space:nowrap}
.zv-back:hover{border-color:var(--ink)}
@media(max-width:680px){.zv-back{padding:8px 10px;font-size:9.5px}}
</style>
</head>
<body>
<div id="qtVoiceWarningToast" aria-live="assertive" role="alert">No speech detected. Please try again.</div>
<div class="qt-modal-overlay show" id="qtVoiceOverlay">
  <div class="qt-modal qt-voice-modal">
    <div class="qt-voice-shell">
      <div class="qt-voice-head">
        <div class="qt-voice-head-row">
          <div class="qt-voice-head-title">
            <div class="qt-z-badge">Z</div>
            <div>
              <h4>Voice Control &middot; Gestures</h4>
              <span id="qtVoiceState">● Ready</span>
            </div>
          </div>
          <div class="zv-user" id="zvUser"><div class="zv-user-av" id="zvUserAv">?</div><div class="zv-user-txt"><b id="zvUserName">Not signed in</b><small id="zvUserEmail">Sign in on the main page</small></div></div>
          <div class="zv-connection-status" id="zvConnectionStatus" aria-live="polite"><span class="zv-connection-dot" id="zvConnectionDot"></span><span id="zvConnectionText">Checking connection</span></div>
          <button class="zv-back" id="qtVoiceCloseBtn" type="button" aria-label="Back to Dashboard" data-href="https://arulv123.github.io/ZIPPY-MAIN-PAGE-1/">Back to Dashboard</button>
        </div>
        <div class="qt-voice-tabs" role="tablist">
          <button class="qt-voice-tab active" id="qtVoiceSpeakTab" type="button" role="tab" aria-selected="true">Speak</button>
          <button class="qt-voice-tab" id="qtVoiceHistoryTab" type="button" role="tab" aria-selected="false">History</button>
        </div>
      </div>
      <section class="qt-voice-panel qt-voice-speak active" id="qtVoiceSpeakPanel" role="tabpanel">
        <div class="qt-voice-messages" id="qtVoiceMessages">
          <div class="qt-voice-empty" id="qtVoiceEmptyState"></div>
        </div>
        <div class="qt-voice-input-area">
          <div class="qt-voice-input-shell" id="qtVoiceInputShell">
            <canvas class="qt-voice-wave" id="qtVoiceWave" aria-hidden="true"></canvas>
            <button class="qt-voice-mic" id="qtVoiceMicBtn" type="button" aria-label="Start recording">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="12" rx="4"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><line x1="12" y1="18" x2="12" y2="21"></line><line x1="9" y1="21" x2="15" y2="21"></line></svg>
            </button>
          </div>
          <div class="zv-live" id="zvLive" aria-live="polite"></div>

    if(!active)return;
    active=false;clearTimers();recognitionWanted=false;
    try{if(recognition&&recognitionLive)recognition.stop();}catch(e){}   /* stop() (not abort) so the final result is delivered */
    analyser=null;cancelAnimationFrame(frame);
    inputShell.classList.remove('recording');micBtn.classList.remove('recording');
    stateEl.textContent='● Processing';
    if(!keepSendButton)sendBtn.classList.remove('show');
    const r=recorder;recorder=null;
    if(r&&r.state==='recording'){try{r.stop();return;}catch(e){}}   /* onstop -> finishRecording */
    finishRecording();
  }

  async function finishRecording(){
    blob=chunks.length?new Blob(chunks,{type:(chunks[0]&&chunks[0].type)||'audio/webm'}):null;
    const t0=Date.now();lastResultTs=t0;
    /* wait for the engine to flush its last words and fire onend */
    while(Date.now()-t0<2000&&(recognitionLive||Date.now()-lastResultTs<400))await new Promise(r=>setTimeout(r,80));
    if(active)return;   /* user already started a new recording */
    capturing=false;
    if(cancelled){cancelled=false;resetLocal(false);resetWave();showLive('');return;}
    const text=cleanTranscript(finalText+' '+interimText);
    showLive(text);
    if(!hasMeaningfulTranscript(text)){
      pendingSend=false;sendBtn.classList.remove('show');
      stateEl.textContent='● No voice detected';
      hint.textContent='No speech detected. Please try again.';
      inputShell.classList.add('voice-warning');showVoiceWarning();
      setTimeout(()=>inputShell.classList.remove('voice-warning'),1800);
      const msg=fatalMsg;fatalMsg='';
      resetLocal(false);resetWave();showLive(msg);
      return;
    }
    if(autoSend.checked||pendingSend){pendingSend=false;setTimeout(()=>sendRecording(),60);}
    else{sendBtn.classList.add('show');stateEl.textContent='● Ready';}
  }

  function addMessage(item,animate){
    if(emptyState)emptyState.style.display='none';
    const box=document.createElement('div');box.className='qt-voice-msg user'+(item.failed?' failed':'');
    box.innerHTML='<div class="qt-voice-msg-head"><span class="qt-voice-msg-label">Audio command</span><span class="qt-voice-msg-time">'+escapeHtml(item.timeLabel||timeNow())+'</span></div><div class="qt-voice-audio-row"><button class="qt-voice-play" type="button" aria-label="Play recording"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg></button><audio class="qt-voice-audio" controls preload="metadata"></audio></div><div class="qt-voice-loader-wrap"><div class="qt-voice-loader-track"><div class="qt-voice-loader-bar"></div></div></div><div class="qt-voice-status-row"><span class="qt-voice-status">'+escapeHtml(item.status||'Sending command')+'</span><span>'+escapeHtml(item.duration||'0:01')+'</span></div><details class="qt-voice-details"><summary>Command details</summary><div class="qt-voice-detail-grid"><span class="qt-voice-detail-key">Text</span><span class="qt-voice-detail-val">'+escapeHtml(item.text||'No transcript available')+'</span><span class="qt-voice-detail-key">Sent</span><span class="qt-voice-detail-val">'+escapeHtml(fmtDate(item.iso||dateNow()))+'</span><span class="qt-voice-detail-key">Status</span><span class="qt-voice-detail-val">'+escapeHtml(item.status||'Pending')+'</span></div></details>';
    messages.appendChild(box);requestAnimationFrame(()=>{messages.scrollTop=Math.max(0,box.offsetTop-messages.clientHeight+box.offsetHeight+12)});
    const audio=box.querySelector('audio'),play=box.querySelector('.qt-voice-play'),bar=box.querySelector('.qt-voice-loader-bar');
    if(!item.audio){const r=box.querySelector('.qt-voice-audio-row');if(r)r.style.display='none';}
    if(item.audio){audio.src=item.audio;play.addEventListener('click',()=>audio.paused?audio.play():audio.pause());audio.addEventListener('play',()=>play.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h3v14H7zm7 0h3v14h-3z"></path></svg>');audio.addEventListener('pause',()=>play.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>')}
    if(animate){bar.style.width='18%';requestAnimationFrame(()=>{bar.style.width='100%'})}
    else bar.style.width=item.status==='Sent command'?'100%':'35%';
    if(item.status==='Sending command'&&!animate)bar.style.width='65%';
    return {box,bar,audio};
  }

  async function sendRecording(){
    if(active){
      pendingSend=true;
      stopRecording(true);
      return;
    }
    if(isSending)return;
    const text=cleanTranscript(finalText+' '+interimText);
    if(!hasMeaningfulTranscript(text)){
      stateEl.textContent='● No voice detected';
      hint.textContent='No speech detected. Please try again.';
      inputShell.classList.add('voice-warning');
      showVoiceWarning();
      setTimeout(()=>inputShell.classList.remove('voice-warning'),1800);
      resetLocal(false);
      resetWave();
      return;
    }
    isSending=true;
    pendingSend=false;
    sendBtn.classList.remove('show');
    stateEl.textContent='● Sending';
    let audioData='';
    try{if(blob)audioData=await dataUrlFromBlob(blob)}catch(e){}
    const item={audio:audioData,text:text||'Voice command',iso:dateNow(),timeLabel:timeNow(),duration:duration(Date.now()-startedAt),status:'Sending command',failed:false};
    const ui=addMessage(item,true);
    let ok=false;
    try{
      const zr=await window.ZV.handleSpeech(item.text,getAlts());
      ok=!!zr.ok;item.matched=zr.label||'';item.reason=zr.reason||'';
    }catch(e){ok=false}
    item.status=ok?('Sent \u00b7 '+(item.matched||'command')):(item.reason||'Failed to send');
    item.failed=!ok;
    const status=ui.box.querySelector('.qt-voice-status');
    const detailVals=ui.box.querySelectorAll('.qt-voice-detail-val');
    status.textContent=item.status;
    if(detailVals[2])detailVals[2].textContent=item.status;
    ui.box.classList.toggle('failed',!ok);
    ui.bar.style.width=ok?'100%':'25%';
    const history=readHistory();history.unshift({...item});writeHistory(history);
    isSending=false;
    stateEl.textContent=ok?'● Sent':'● Send failed';
    renderHistory();
    resetLocal(false);
  }

  function resetLocal(clearView){
    segAlts=[];
    finalText='';interimText='';blob=null;chunks=[];startedAt=0;voiceDetected=false;sendBtn.classList.remove('show');pendingSend=false;if(clearView){messages.innerHTML='';}hint.textContent='Tap the mic to start';stateEl.textContent='● Ready';
  }

  function resetRecording(){cancelled=true;if(active)stopRecording(false);else cancelled=false;stopRecognition();clearTimers();showLive('');resetLocal(false);resetWave()}

  function renderHistory(){
    const list=readHistory();historyList.innerHTML='';
    if(!list.length){historyList.innerHTML='';return}
    list.forEach(item=>{
      const row=document.createElement('div');row.className='qt-voice-history-item';row.innerHTML='<div class="qt-voice-history-main"><div class="qt-voice-history-title">'+escapeHtml(item.text||'Voice command')+'</div><div class="qt-voice-history-meta"><span>'+escapeHtml(fmtDate(item.iso))+'</span><span>'+escapeHtml(item.status||'Sent command')+'</span><span>'+escapeHtml(item.duration||'0:01')+'</span></div></div><audio class="qt-voice-history-audio" controls preload="metadata"></audio>';
      const a=row.querySelector('audio');if(item.audio)a.src=item.audio;historyList.appendChild(row);
    });
  }

  micBtn.addEventListener('click',()=>{if(active)stopRecording(!autoSend.checked);else startRecording()});
  sendBtn.addEventListener('click',()=>{pendingSend=true;sendRecording()});
  resetBtn.addEventListener('click',resetRecording);
  autoSend.addEventListener('change',()=>{sendBtn.classList.toggle('show',!autoSend.checked&&active)});
  speakTab.addEventListener('click',()=>setTab('speak'));historyTab.addEventListener('click',()=>setTab('history'));
  closeBtn.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();closeVoice()},{capture:true});
  closeBtn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();closeVoice()},{capture:true});
  document.addEventListener('click',e=>{if(e.target===closeBtn||e.target.closest&&e.target.closest('#qtVoiceCloseBtn')){e.preventDefault();e.stopPropagation();closeVoice();}},true);
  window.addEventListener('resize',resizeCanvas);
  window.addEventListener('beforeunload',()=>{releaseMicrophone();});
})();
</script>

<script type="text/plain" id="zvCreatorDoc"><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Gesture — Zippy</title>
<style>
  :root{--bg:#0e0f11;--panel:#17181b;--panel-2:#1f2124;--border:#2a2c30;--text:#e8e6e1;--text-dim:#8b8d92;--accent:#5dcaa5;--accent-dim:#1d9e75;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;}

  #panel{width:300px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;}

  .finger-row{margin-bottom:14px;}
  .finger-row:last-child{margin-bottom:0;}
  .finger-label{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:6px;}
  .finger-label span:last-child{color:var(--text-dim);font-size:11px;font-variant-numeric:tabular-nums;}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:var(--panel-2);outline:none;border:1px solid var(--border);}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg);}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg);}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}
  button{font-family:inherit;font-size:12px;font-weight:500;background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 12px;cursor:pointer;transition:background 0.15s,border-color 0.15s;}
  button:hover{background:#26282c;border-color:#3a3c40;}
  button:active{transform:scale(0.98);}
  button.primary{background:var(--accent-dim);border-color:var(--accent-dim);color:#eafff5;}
  button.primary:hover{background:#0f7e60;}
  #cache-info{font-size:11px;color:var(--text-dim);line-height:1.6;background:var(--panel-2);border-radius:6px;padding:10px 12px;border:1px solid var(--border);}
  .hint{font-size:11px;color:var(--text-dim);line-height:1.5;margin-top:10px;}
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#2a2c30;border-radius:4px;}
  #topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap;row-gap:10px;}
  #topbar .tb-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  #topbar .tb-title{font-size:14px;font-weight:600;letter-spacing:-0.01em;}
  #topbar .tb-title span{color:var(--text-dim);font-weight:400;font-size:12px;margin-left:8px;}
  #topbar .tb-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .video-toggle{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-dim);}
  .switch{position:relative;width:38px;height:22px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .switch .track{position:absolute;inset:0;background:var(--panel-2);border:1px solid var(--border);border-radius:999px;transition:background .2s,border-color .2s;cursor:pointer;}
  .switch .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--text-dim);transition:transform .2s,background .2s;}
  .switch input:checked + .track{background:var(--accent-dim);border-color:var(--accent-dim);}
  .switch input:checked + .track .knob{transform:translateX(16px);background:#eafff5;}
  .save-pos-wrap{height:0;overflow:visible;position:relative;}
  .save-pos-pill{display:flex;align-items:center;gap:6px;max-height:0;opacity:0;transform:translateY(-4px);overflow:hidden;transition:max-height .22s ease,opacity .22s ease,transform .22s ease,margin-top .22s ease;margin-top:0;}
  .save-pos-pill.show{max-height:40px;opacity:1;transform:translateY(0);margin-top:8px;}
  .save-pos-pill button{font-size:11px;padding:6px 10px;background:var(--accent-dim);border-color:var(--accent-dim);color:#eafff5;}
  .save-pos-pill button:hover{background:#0f7e60;}
  .save-pos-pill .label{font-size:10.5px;color:var(--text-dim);}
  #sequence-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
  .seq-step{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;}
  .seq-step .seq-thumb{width:40px;height:40px;border-radius:6px;flex-shrink:0;overflow:hidden;background:#46433d;border:1px solid var(--border);}
  .seq-step .seq-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .seq-step .seq-body{flex:1;min-width:0;}
  .seq-step .seq-meta{font-size:10.5px;color:var(--text-dim);margin-top:2px;}
  .seq-step .seq-delay{display:flex;align-items:center;gap:5px;flex-shrink:0;}
  .seq-step .seq-delay input{width:52px;background:var(--panel);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:11px;padding:4px 5px;text-align:right;}
  .seq-step .seq-delay span{font-size:10px;color:var(--text-dim);}
  .seq-step .seq-remove{background:transparent;border:1px solid var(--border);color:var(--text-dim);border-radius:5px;padding:5px 7px;font-size:12px;line-height:1;flex-shrink:0;}
  .seq-step .seq-remove:hover{color:#e05252;border-color:#e05252;}
  .seq-empty{font-size:11.5px;color:var(--text-dim);padding:14px 10px;text-align:center;border:1px dashed var(--border);border-radius:8px;}
  .seq-step .seq-drag{cursor:grab;color:var(--text-dim);font-size:14px;padding:2px 4px;flex-shrink:0;user-select:none;}
  .seq-step.dragging{opacity:0.4;}
  .seq-step .seq-name-input{width:100%;background:transparent;border:none;border-bottom:1px dashed transparent;color:var(--text);font-size:12px;font-weight:600;font-family:inherit;padding:0;}
  .seq-step .seq-name-input:focus{outline:none;border-bottom-color:var(--accent);}
  .seq-step.group .seq-title-badge{display:inline-block;font-size:9px;text-transform:uppercase;letter-spacing:.04em;background:var(--accent-dim);color:#eafff5;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle;}
  .transport{display:flex;align-items:center;gap:8px;margin-top:4px;}
  .transport button{padding:8px 12px;}
  .transport .scrub{font-size:11px;color:var(--text-dim);margin-left:auto;}
  #preview-overlay{position:fixed;inset:0;background:rgba(8,9,10,0.72);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:200;padding:24px;}
  #preview-overlay.open{display:flex;}
  #preview-modal{width:min(880px,100%);max-height:92vh;overflow-y:auto;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:22px;}
  #preview-modal h2{font-size:16px;margin:0 0 4px;}
  #preview-modal p.sub{font-size:12px;color:var(--text-dim);margin:0 0 18px;}
  .preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media (max-width:640px){.preview-grid{grid-template-columns:1fr;}}
  .preview-card{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:14px;}
  .preview-card h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);margin:0 0 10px;}
  .preview-img-frame{width:100%;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:#000;position:relative;}
  .preview-img-frame img,.preview-img-frame video{width:100%;height:100%;object-fit:cover;display:block;}
  .preview-card .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .angle-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .angle-chip{font-size:10.5px;padding:5px 9px;border-radius:999px;border:1px solid var(--border);background:var(--panel);color:var(--text-dim);cursor:pointer;}
  .angle-chip.active{background:var(--accent-dim);border-color:var(--accent-dim);color:#eafff5;}
  .preview-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap;}
  .preview-footer button{padding:10px 16px;}
  #preview-save-publish{display:none!important}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--panel-2);border:1px solid var(--border);color:var(--text);font-size:12px;padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;z-index:300;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .warn-toast{position:fixed;top:64px;left:16px;display:flex;align-items:center;gap:8px;background:#3a2420;border:1px solid #7a3a2e;color:#ffd9cf;font-size:12px;padding:10px 14px;border-radius:8px;max-width:340px;line-height:1.4;transform:translateX(-120%);opacity:0;transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .32s ease;z-index:300;box-shadow:0 6px 18px rgba(0,0,0,0.35);pointer-events:none;}
  .warn-toast.show{transform:translateX(0);opacity:1;}
  .lib-overlay{position:fixed;inset:0;background:rgba(10,10,12,.72);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:400;padding:24px;}
  .lib-overlay.open{display:flex;}
  .lib-box{width:min(680px,100%);max-height:86vh;display:flex;flex-direction:column;background:#1a1a1e;border:1px solid #2e2e34;border-radius:14px;overflow:hidden;box-shadow:0 30px 70px -30px rgba(0,0,0,.8);}
  .lib-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid #2e2e34;}
  .lib-bar h3{margin:0;font-size:15px;font-weight:600;color:#f2f2f4;}
  .lib-close{background:none;border:0;color:#9a9aa2;font-size:15px;cursor:pointer;padding:4px 8px;}
  .lib-close:hover{color:#f2f2f4;}
  .lib-note{margin:0;padding:12px 18px 4px;font-size:12px;line-height:1.5;color:#9a9aa2;}
  .lib-list{overflow:auto;padding:12px 18px 18px;display:flex;flex-direction:column;gap:10px;}
  .lib-item{display:flex;align-items:center;gap:14px;padding:10px;border:1px solid #2e2e34;border-radius:10px;background:#202026;cursor:pointer;transition:border-color .15s,background .15s;}
  .lib-item:hover{border-color:#4a9a7a;background:#24242b;}
  .lib-thumb{width:72px;height:72px;flex:0 0 72px;border-radius:8px;background:#46433d;object-fit:cover;display:block;}
  .lib-meta{min-width:0;flex:1;}
  .lib-name{font-size:14px;font-weight:600;color:#f2f2f4;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lib-sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#9a9aa2;line-height:1.6;}
  .lib-load{flex:0 0 auto;padding:7px 14px;border-radius:7px;border:0;background:#2f9e6e;color:#fff;font-size:12px;font-weight:600;cursor:pointer;}
  .lib-empty{padding:26px 4px;text-align:center;color:#9a9aa2;font-size:13px;line-height:1.6;}
</style>

<body>

<div id="topbar">
  <div class="tb-left"><div class="tb-title">Create Gesture<span>Zippy Gesture Library</span></div></div>
  <div class="tb-right">
    <button id="upload-gesture-btn">Upload a gesture from Gesture Library</button>
    <button class="back-link" id="gesture-library-btn" type="button">✕ Close</button>
    <button id="save-gesture-top" class="primary">Save Gesture</button>
  </div>
</div>

<div id="app">
  <div id="viewport">
    <div id="canvas-host"></div>
    <div id="status" class="loading"><div class="dot"></div><span id="status-text">Building hand model…</span></div>
  </div>

  <div id="panel">
    <div id="panel-header">
      <h1>Create a gesture</h1>
      <p>Move any joint below, then tap <strong>Save position</strong> to lock that pose in as the next step of the motion. Build up as many steps as you like, set the delay between each, then preview and publish.</p>
    </div>

    <div class="section" id="sequence-section">
      <p class="section-title">Motion sequence</p>
      <div class="btn-row" style="margin-bottom:12px"><button id="save-group-btn" class="primary">Save Group</button></div>
      <div class="hint" style="margin-top:0;margin-bottom:12px">Move several joints without tapping the per-slider Save position button, then tap <strong>Save Group</strong> to capture everything that changed since the last step as one combined move, played back smoothly.</div>
      <div id="sequence-list">
        <div class="seq-empty" id="sequence-empty">No positions saved yet — move a joint and tap Save position, or move several and tap Save Group.</div>
      </div>
      <div class="hint">Drag the ⠿ handle to reorder steps. Click a step's name to rename it. Steps play back with smooth, interpolated motion between each position — not an instant jump — using the delay set on each step.</div>
      <div class="transport">
        <button id="play-sequence">▶ Play</button>
        <button id="pause-sequence" disabled>❚❚ Pause</button>
        <span class="scrub" id="sequence-count">0 steps</span>
      </div>
    </div>

    var dir = new THREE.Vector3(0.55, 0.32, -1).normalize();

    autoFocusActive = true;
  }

  var CHAIN_ORDER = ['shoulder','elbow','wrist','fingers'];
  var PAIR_ANCHOR = {
    'shoulder,elbow': function(){ return shoulderAnchor; },
    'elbow,wrist':    function(){ return elbowPivot; },
    'wrist,fingers':  function(){ return wristGroup; }
  };
  function adjacentPairAnchor(groups){
    var moved = CHAIN_ORDER.filter(function(k){ return groups[k]; });
    if (moved.length !== 2) return null;
    var i0 = CHAIN_ORDER.indexOf(moved[0]), i1 = CHAIN_ORDER.indexOf(moved[1]);
    if (Math.abs(i0 - i1) !== 1) return null;
    var key = moved[0] + ',' + moved[1];
    var fn = PAIR_ANCHOR[key];
    return fn ? fn() : null;
  }

  var pairBox = new THREE.Box3();
  function framePairShot(anchorObj, sweepBox){
    isDragging = false;
    autoFocusMode = 'hand';
    lastArmFocusFn = function(){ framePairShot(anchorObj, sweepBox); };
    var box;
    if (sweepBox){ box = sweepBox; }
    else {
      scene.updateMatrixWorld(true);
      pairBox.setFromObject(anchorObj);
      box = pairBox;
    }
    var center = new THREE.Vector3();
    var size = new THREE.Vector3();
    box.getCenter(center);
    box.getSize(size);
    var radius = size.length() * 0.5;
    var vFov = camera.fov * Math.PI / 180;
    var aspect = camera.aspect || (host.clientWidth / host.clientHeight);
    var hFov = 2 * Math.atan(Math.tan(vFov/2) * aspect);
    var limitingFov = Math.min(vFov, hFov);
    var dist = Math.max((radius / 0.7) / Math.sin(limitingFov/2), 3) * getArmZoomScale();
    var dir = new THREE.Vector3(0.68, 0.42, -0.85).normalize();

    handTargetLookAt.copy(center);
    handTargetUp.set(0, 1, 0);
    autoFocusActive = true;
  }

  function frameMultiJoint(groups, sweepBox, pairSweepBox){
    var anchor = adjacentPairAnchor(groups);
    if (anchor){ framePairShot(anchor, pairSweepBox); }
    else { frameHeroShot(sweepBox); }
  }

  var sweepBoxA = new THREE.Box3();
  var sweepBoxB = new THREE.Box3();
  var sweepUnion = new THREE.Box3();
  var pairSweepA = new THREE.Box3();
  var pairSweepB = new THREE.Box3();
  var pairSweepUnion = new THREE.Box3();
  function computeSweepBoxes(fromPose, toPose, pairAnchorObj){
    var restorePose = currentPose();
    applyPose(fromPose, { silent: true });
    scene.updateMatrixWorld(true);
    sweepBoxA.setFromObject(armAssembly);
    if (pairAnchorObj) pairSweepA.setFromObject(pairAnchorObj);
    applyPose(toPose, { silent: true });
    scene.updateMatrixWorld(true);
    sweepBoxB.setFromObject(armAssembly);
    if (pairAnchorObj) pairSweepB.setFromObject(pairAnchorObj);
    sweepUnion.copy(sweepBoxA).union(sweepBoxB);
    var pairResult = null;
    if (pairAnchorObj){
      pairSweepUnion.copy(pairSweepA).union(pairSweepB);
      pairResult = pairSweepUnion;
    }
    applyPose(restorePose, { silent: true });
    scene.updateMatrixWorld(true);
    return { hero: sweepUnion, pair: pairResult };
  }

  function frameForGroups(groups){
    return new Promise(function(resolve){
      if (cameraMode === 'fixed'){
        frameFixedWide(true);
        renderer.render(scene, camera);
        requestAnimationFrame(function(){ resolve(); });
        return;
      }
      if (groups.multi){ frameMultiJoint(groups); }
      else if (groups.arm){ focusArm(); }
      else { focusFingers(true); }
      camPos.copy(handTargetPos);
      camLookAt.copy(handTargetLookAt);
      camera.position.copy(camPos);
      camera.lookAt(camLookAt);
      renderer.render(scene, camera);
      requestAnimationFrame(function(){ resolve(); });
    });
  }

  function captureImage(opts){
    opts = opts || {};
    var hq = opts.highQuality !== false;
    if (!hq){
      renderer.render(scene, camera);
      return renderer.domElement.toDataURL('image/png');
    }
    var prevRatio = renderer.getPixelRatio();
    var targetRatio = Math.max(prevRatio, Math.min(window.devicePixelRatio || 1, 2) * 2, 3);
    renderer.setPixelRatio(targetRatio);
    renderer.setSize(host.clientWidth, host.clientHeight, false);
    camera.aspect = host.clientWidth / host.clientHeight;
    camera.updateProjectionMatrix();
    renderer.render(scene, camera);
    var dataUrl = renderer.domElement.toDataURL('image/png', 1.0);
    renderer.setPixelRatio(prevRatio);
    renderer.setSize(host.clientWidth, host.clientHeight, false);
    camera.updateProjectionMatrix();
    renderer.render(scene, camera);
    return dataUrl;
  }

  function easeInOutCubic(t){ return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }

  var activeTween = null;
  function tweenTo(fromPose, toPose, durationMs, groups, onFrame){
    return new Promise(function(resolve){
      if (activeTween) activeTween.cancelled = true;
      var tweenState = { cancelled:false };
      activeTween = tweenState;
      playbackActive = true;
      autoFocusActive = true;

      var restPose = defaultPose();
      var fromCumulative = movedGroups(fromPose, restPose);
      var toCumulative = movedGroups(toPose, restPose);
      var liveGroups = {
        fingers: fromCumulative.fingers || toCumulative.fingers,
        wrist: fromCumulative.wrist || toCumulative.wrist,
        elbow: fromCumulative.elbow || toCumulative.elbow,
        shoulder: fromCumulative.shoulder || toCumulative.shoulder
      };
      liveGroups.arm = liveGroups.wrist || liveGroups.elbow || liveGroups.shoulder;
      var liveMovedCount = [liveGroups.fingers, liveGroups.wrist, liveGroups.elbow, liveGroups.shoulder].filter(Boolean).length;
      liveGroups.multi = liveMovedCount > 1;

      if (cameraMode === 'fixed'){
        var fixedSweep = (fixedViewStale || !FIXED_VIEW_POS) ? computeSweepBoxes(fromPose, toPose, null).hero : null;
        frameFixedWide(false, fixedSweep);
      } else if (liveGroups.multi){
        var pairAnchor = adjacentPairAnchor(liveGroups);
        var sweep = computeSweepBoxes(fromPose, toPose, pairAnchor);
        frameMultiJoint(liveGroups, sweep.hero, sweep.pair);
      } else if (liveGroups.arm){
        focusArm();
      } else {
        fingerViewStale = true;
        focusFingers(true);
      }

      var startTime = performance.now();
      function frame(now){
        if (tweenState.cancelled) return resolve();
        var t = Math.min(1, (now - startTime) / durationMs);
        var eased = easeInOutCubic(t);
        var mid = {};
        jointIds.forEach(function(id){
          var a = fromPose[id], b = toPose[id];
          mid[id] = a + (b - a) * eased;
        });
        applyPose(mid, { silent: true });
        if (onFrame) onFrame(eased);
        if (t < 1){ requestAnimationFrame(frame); }
        else {
          if (activeTween === tweenState) activeTween = null;
          if (!activeTween) playbackActive = false;
          resolve();
        }
      }
      requestAnimationFrame(frame);
    });
  }

  window.HandRig = {
    currentPose: currentPose,
    applyPose: applyPose,
    defaultPose: defaultPose,
    movedGroups: movedGroups,
    frameForGroups: frameForGroups,
    captureImage: captureImage,
    canvasEl: renderer.domElement,
    tweenTo: tweenTo,
    setCameraMode: setCameraMode,
    setArmZoomPercent: setArmZoomPercent,
    onSliderChange: null
  };

  jointIds.forEach(function(id){
    document.getElementById(id).addEventListener('input', function(){
      if (window.HandRig.onSliderChange) window.HandRig.onSliderChange(id);
    });
  });
})();

<script>
(function(){
  function whenRigReady(cb){
    if (window.__handRigReady && window.HandRig) return cb();

  }

  var toastEl = document.getElementById('toast');
  var toastTimer;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2200);
  }

  var warnEl = document.getElementById('warn-toast');
  var warnTimer;
  function warn(msg){
    warnEl.textContent = msg;
    warnEl.classList.remove('show');
    void warnEl.offsetWidth;
    warnEl.classList.add('show');
    clearTimeout(warnTimer);
    warnTimer = setTimeout(function(){ warnEl.classList.remove('show'); }, 2800);
  }

  function posesEqual(a, b){
    return Object.keys(a).every(function(id){ return Math.round(a[id]) === Math.round(b[id]); });
  }

  whenRigReady(function(){
    var Rig = window.HandRig;

    var pills = Array.prototype.slice.call(document.querySelectorAll('.save-pos-pill'));
    function showPillFor(id){
      pills.forEach(function(p){ p.classList.toggle('show', p.getAttribute('data-for') === id); });
    }
    Rig.onSliderChange = function(id){ showPillFor(id); };

    pills.forEach(function(pill){
      pill.querySelector('.save-pos-btn').addEventListener('click', function(){
        saveCurrentAsStep();
        pill.classList.remove('show');
      });
    });

    var sequence = [];
    var baselinePose = Rig.defaultPose();
    var stepCounter = 0;

    var seqListEl = document.getElementById('sequence-list');
    var seqEmptyEl = document.getElementById('sequence-empty');
    var seqCountEl = document.getElementById('sequence-count');
    var previewSeqListEl = document.getElementById('preview-sequence-list');

    function groupLabelFor(step){
      return step.groups.fingers && step.groups.arm ? 'Fingers + arm'
           : step.groups.fingers ? 'Fingers'
           : step.groups.arm ? 'Arm / shoulder'
           : 'No change';
    }

    function renderStepList(container, emptyEl){
      if (emptyEl) container.querySelectorAll('.seq-step').forEach(function(n){ n.remove(); });
      else container.innerHTML = '';
      if (emptyEl) emptyEl.style.display = sequence.length ? 'none' : 'block';

      sequence.forEach(function(step, i){
        var row = document.createElement('div');
        row.className = 'seq-step' + (step.isGroup ? ' group' : '');
        row.setAttribute('draggable', 'true');
        row.dataset.stepId = step.id;

        row.innerHTML =
          '<span class="seq-drag" title="Drag to reorder">⠿</span>' +
          '<div class="seq-thumb"><img src="'+step.image+'" alt="'+step.name+'"></div>' +
          '<div class="seq-body">' +
            '<input class="seq-name-input" value="'+step.name+'">' +
            '<div class="seq-meta">'+groupLabelFor(step)+(step.isGroup?' <span class="seq-title-badge">Group</span>':'')+'</div>' +
          '</div>' +
          '<div class="seq-delay"><input type="number" min="0" step="50" value="'+step.delay+'"><span>ms</span></div>' +
          '<button class="seq-remove" title="Remove step">✕</button>';

        row.querySelector('.seq-name-input').addEventListener('input', function(e){
          step.name = e.target.value || step.name;
          syncOtherList(container);
        });
        row.querySelector('.seq-delay input').addEventListener('input', function(e){
          step.delay = Math.max(0, parseInt(e.target.value, 10) || 0);
          syncOtherList(container);
        });
        row.querySelector('.seq-remove').addEventListener('click', function(){
          sequence = sequence.filter(function(s){ return s.id !== step.id; });
          renderSequence();
        });

        row.addEventListener('dragstart', function(){ row.classList.add('dragging'); });
        row.addEventListener('dragend', function(){
          row.classList.remove('dragging');
          renderSequence();
        });
        row.addEventListener('dragover', function(e){
          e.preventDefault();
          var dragging = container.querySelector('.seq-step.dragging');
          if (!dragging || dragging === row) return;
          var rect = row.getBoundingClientRect();
          var before = (e.clientY - rect.top) < rect.height / 2;
          container.insertBefore(dragging, before ? row : row.nextSibling);
        });
        row.addEventListener('drop', function(){
          var ids = Array.prototype.slice.call(container.querySelectorAll('.seq-step')).map(function(n){ return n.dataset.stepId; });
          sequence.sort(function(a,b){ return ids.indexOf(a.id) - ids.indexOf(b.id); });
        });

        container.appendChild(row);
      });
    }

    function syncOtherList(fromContainer){
      if (fromContainer === seqListEl) renderStepList(previewSeqListEl, null);
      else renderStepList(seqListEl, seqEmptyEl);
    }

    function renderSequence(){
      renderStepList(seqListEl, seqEmptyEl);
      renderStepList(previewSeqListEl, null);
      seqCountEl.textContent = sequence.length + (sequence.length === 1 ? ' step' : ' steps');
    }

    function makeStep(pose, groups, image, isGroup){
      stepCounter++;
      return {
        id: 's' + Date.now() + '_' + stepCounter,
        name: (isGroup ? 'Group move ' : 'Step ') + stepCounter,
        pose: pose, groups: groups, image: image, delay: 900, isGroup: !!isGroup
      };
    }

    var savingStep = false;
    function saveCurrentAsStep(){
      if (savingStep) return;
      var pose = Rig.currentPose();
      if (posesEqual(pose, baselinePose)){
        warn('Unable to save — nothing has changed since the last step. If you want to increase the timing, raise that step\u2019s delay instead.');
        return;
      }
      savingStep = true;
      var groups = Rig.movedGroups(pose, baselinePose);
      Rig.frameForGroups(groups).then(function(){
        var image = Rig.captureImage({ highQuality: true });
        sequence.push(makeStep(pose, groups, image, false));
        baselinePose = pose;
        renderSequence();
        toast('Position saved as "' + sequence[sequence.length-1].name + '"');
      }).finally(function(){ savingStep = false; });
    }

    var savingGroup = false;
    function saveGroupAsStep(){
      if (savingGroup) return;
      var pose = Rig.currentPose();
      var groups = Rig.movedGroups(pose, baselinePose);
      if (!groups.fingers && !groups.arm || posesEqual(pose, baselinePose)){
        warn('Unable to save — nothing has changed since the last step. If you want to increase the timing, raise that step\u2019s delay instead.');
        return;
      }
      savingGroup = true;
      Rig.frameForGroups(groups).then(function(){
        var image = Rig.captureImage({ highQuality: true });
        sequence.push(makeStep(pose, groups, image, true));
        baselinePose = pose;
        renderSequence();
        toast('Group move saved as "' + sequence[sequence.length-1].name + '"');
      }).finally(function(){ savingGroup = false; });
    }
    document.getElementById('save-group-btn').addEventListener('click', saveGroupAsStep);

    renderSequence();

    var playBtn = document.getElementById('play-sequence');
    var pauseBtn = document.getElementById('pause-sequence');
    var isPlaying = false;
    var playToken = 0;

    function runSmoothPlayback(onStep, token){
      if (!sequence.length){ return Promise.resolve(); }
      var current = Rig.currentPose();
      var i = 0;
      function next(){
        if (token !== playToken) return Promise.resolve();
        var step = sequence[i % sequence.length];
        var duration = Math.max(150, step.delay);
        return Rig.tweenTo(current, step.pose, duration, step.groups).then(function(){
          current = step.pose;
          if (onStep) onStep(step, i);
          i++;
          if (token !== playToken) return;
          return next();
        });
      }
      return next();
    }

    function startPlayback(){
      if (!sequence.length){ toast('Save at least one position first'); return; }
      isPlaying = true;
      playToken++;
      var token = playToken;
      playBtn.disabled = true;
      pauseBtn.disabled = false;
      runSmoothPlayback(null, token);
    }
    function stopPlayback(){
      isPlaying = false;
      playToken++;
      playBtn.disabled = false;
      pauseBtn.disabled = true;
    }
    playBtn.addEventListener('click', startPlayback);
    pauseBtn.addEventListener('click', stopPlayback);

    var VIDEO_MODE = true;

    var cameraModeToggle = document.getElementById('camera-mode-toggle');
    var cameraModeLabel = document.getElementById('camera-mode-label');
    var cameraModeHint = document.getElementById('camera-mode-hint');
    var previewCameraModeToggle = document.getElementById('preview-camera-mode-toggle');
    var previewCameraModeHint = document.getElementById('preview-camera-mode-hint');

    function applyCameraMode(fixed){
      Rig.setCameraMode(fixed ? 'fixed' : 'moving');
      cameraModeToggle.checked = fixed;
      cameraModeLabel.textContent = fixed ? 'Fixed camera (follow off)' : 'Follow camera';
      cameraModeHint.textContent = fixed
        ? 'Follow camera is off: one distant, unmoving wide angle is used for every photo and every frame of the motion, always keeping the whole arm — shoulder to fingertips — in frame together, so you see the entire arm move without any cutting or panning.'
        : 'Follow camera: the shot tracks the palm and tightens on whatever joints just moved, for close-up detail shots. Switch off for one distant, unmoving wide angle that keeps the whole arm — shoulder to fingertips — in frame for every photo and every frame of the motion, so you can watch the entire arm move without the camera cutting or panning.';
      previewCameraModeToggle.textContent = fixed ? 'Fixed camera: On' : 'Fixed camera: Off';
      previewCameraModeToggle.classList.toggle('primary', fixed);
      previewCameraModeHint.textContent = fixed
        ? 'Fixed camera on: one unmoving wide angle keeps the whole arm in frame for every frame of the motion and every photo.'
        : 'Fixed camera off: the shot tracks whatever joints just moved. Turn on for one unmoving wide angle that keeps the whole arm in frame for every frame of the motion.';
    }
    cameraModeToggle.addEventListener('change', function(){ applyCameraMode(cameraModeToggle.checked); });
    previewCameraModeToggle.addEventListener('click', function(){ applyCameraMode(!cameraModeToggle.checked); });

    var armZoomSlider = document.getElementById('arm-zoom-slider');
    var outArmZoom = document.getElementById('out-arm-zoom');
    armZoomSlider.addEventListener('input', function(){
      var pct = parseInt(armZoomSlider.value, 10) || 100;
      outArmZoom.textContent = pct + '%';
      Rig.setArmZoomPercent(pct);
    });

    var libOverlay = document.getElementById('lib-overlay');
    var libList = document.getElementById('lib-list');
    var loadedGestureName = null;

    function readLibrary(){
      try{
        var hub = window.parent && window.parent.__zippyHub;
        if (hub && typeof hub.loadCustom === 'function'){
          var hostList = hub.loadCustom();
          if (Array.isArray(hostList)) return hostList;
        }
      }catch(e){}
      try{
        var raw = localStorage.getItem('zippyCustomGestures');
        var list = raw ? JSON.parse(raw) : [];
        return Array.isArray(list) ? list : [];
      }catch(e){ return []; }
    }

    function gestureRuntime(g){
      return (g.sequence || []).reduce(function(a, s){ return a + Math.max(0, s.delay || 0); }, 0);
    }

    function gestureParts(g){
      var base = Rig.defaultPose();
      var groups = { fingers:false, wrist:false, elbow:false, shoulder:false };
      (g.sequence || []).forEach(function(st){
        var p = st.pose || {};
        ['thumb','index','middle','ring','pinky'].forEach(function(id){
          if (p[id] != null && Math.round(p[id]) !== Math.round(base[id])) groups.fingers = true;
        });
        if (p['wrist-slider'] != null && Math.round(p['wrist-slider']) !== Math.round(base['wrist-slider'])) groups.wrist = true;
        if (p['arm-slider'] != null && Math.round(p['arm-slider']) !== Math.round(base['arm-slider'])) groups.elbow = true;
        ['shoulder-slider','abduction-slider','extend-slider'].forEach(function(id){
          if (p[id] != null && Math.round(p[id]) !== Math.round(base[id])) groups.shoulder = true;
        });
      });
      var names = Object.keys(groups).filter(function(k){ return groups[k]; });
      return names.length ? names.join(' + ') : 'static pose';
    }

    function openLibrary(){
      var list = readLibrary();
      if (!list.length){
        libList.innerHTML = '<div class="lib-empty">Nothing in your library yet.<br>Save a gesture first, then it will show up here to load and edit.</div>';
      } else {
        libList.innerHTML = list.map(function(g, i){
          var steps = (g.sequence || []).length;
          var secs = Math.round(gestureRuntime(g) / 100) / 10;
          var thumb = g.coverImage
            ? '<img class="lib-thumb" src="' + g.coverImage + '" alt="">'
            : '<div class="lib-thumb"></div>';
          return '<div class="lib-item" data-i="' + i + '">' + thumb +
            '<div class="lib-meta">' +
              '<div class="lib-name">' + (g.name || 'Untitled') + '</div>' +
              '<div class="lib-sub">' + steps + ' step' + (steps === 1 ? '' : 's') +
                ' \u00B7 ' + secs + 's \u00B7 ' + gestureParts(g) + '</div>' +
            '</div>' +
            '<button class="lib-load" type="button">Load</button></div>';
        }).join('');
        Array.prototype.forEach.call(libList.querySelectorAll('.lib-item'), function(row){
          row.addEventListener('click', function(){ loadGestureIntoEditor(list[parseInt(row.dataset.i, 10)]); });
        });

      libOverlay.classList.add('open');
    }
    function closeLibrary(){ libOverlay.classList.remove('open'); }

    function loadGestureIntoEditor(g){
      if (!g) return;
      var src = (g.sequence || []).filter(function(s){ return s && s.pose; });
      if (!src.length){ toast('That gesture has no recorded steps'); return; }

      stopPlayback();

      sequence = src.map(function(s, si){
        stepCounter++;
        return {
          id: 's' + Date.now() + '_' + stepCounter,
          name: s.name || ('Step ' + (si + 1)),
          pose: JSON.parse(JSON.stringify(s.pose)),
          groups: s.groups ? JSON.parse(JSON.stringify(s.groups)) : Rig.movedGroups(s.pose, Rig.defaultPose()),
          image: s.image || '',
          delay: Math.max(0, s.delay || 0),
          isGroup: !!s.isGroup
        };

      baselinePose = last;
      Rig.applyPose(last);
      loadedGestureName = g.name || null;
      renderSequence();
      closeLibrary();
      toast('Loaded "' + (g.name || 'gesture') + '" \u2014 ' + sequence.length + ' steps. Edit and save as a new gesture.');

    document.getElementById('upload-gesture-btn').addEventListener('click', openLibrary);
    document.getElementById('lib-close').addEventListener('click', closeLibrary);

    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape' && libOverlay.classList.contains('open')) closeLibrary();
    });

    var overlay = document.getElementById('preview-overlay');
    var previewImg = document.getElementById('preview-img');
    var previewVideoCanvas = document.getElementById('preview-video-canvas');
    var currentAngle = { image: 'auto', video: 'auto' };

    function angleGroupsOverride(angle, naturalGroups){
      if (angle === 'front') return { fingers: true, arm: false };
      if (angle === 'side') return { fingers: false, arm: true };
      if (angle === 'wide') return { fingers: true, arm: true };
      return naturalGroups;
    }

    function refreshImagePreview(){
      if (!sequence.length){
        previewImg.src = Rig.captureImage({ highQuality: true });
        return;
      }
      var last = sequence[sequence.length - 1];
      Rig.applyPose(last.pose, { silent: true });
      var cumulativeGroups = Rig.movedGroups(last.pose, Rig.defaultPose());
      var groups = angleGroupsOverride(currentAngle.image, cumulativeGroups);
      Rig.frameForGroups(groups).then(function(){
        previewImg.src = Rig.captureImage({ highQuality: true });
      });
    }

    document.querySelectorAll('#image-angle-row .angle-chip').forEach(function(chip){
      chip.addEventListener('click', function(){
        document.querySelectorAll('#image-angle-row .angle-chip').forEach(function(c){ c.classList.remove('active'); });
        chip.classList.add('active');
        currentAngle.image = chip.getAttribute('data-angle');
        refreshImagePreview();
      });
    });
    document.querySelectorAll('#video-angle-row .angle-chip').forEach(function(chip){
      chip.addEventListener('click', function(){
        document.querySelectorAll('#video-angle-row .angle-chip').forEach(function(c){ c.classList.remove('active'); });
        chip.classList.add('active');
        currentAngle.video = chip.getAttribute('data-angle');
      });
    });

    document.getElementById('recapture-btn').addEventListener('click', function(){
      document.querySelectorAll('#image-angle-row .angle-chip').forEach(function(c){ c.classList.remove('active'); });
      var autoChip = document.querySelector('#image-angle-row .angle-chip[data-angle="auto"]');
      if (autoChip) autoChip.classList.add('active');
      currentAngle.image = 'auto';
      refreshImagePreview();
      toast('Recaptured cover image');
    });

    var previewVideoCtx = previewVideoCanvas.getContext('2d');

    function drawFrameToPreviewCanvas(){
      var src = Rig.canvasEl;
      if (!previewVideoCanvas.width || previewVideoCanvas.width !== src.width || previewVideoCanvas.height !== src.height){
        previewVideoCanvas.width = src.width;
        previewVideoCanvas.height = src.height;
      }
      previewVideoCtx.drawImage(src, 0, 0, previewVideoCanvas.width, previewVideoCanvas.height);
    }

    var previewPlaying = false;
    var previewToken = 0;
    function runSmoothPreview(token){
      if (!sequence.length) return Promise.resolve();
      var current = Rig.currentPose();
      var i = sequence.length > 1 ? 1 : 0;
      function next(){
        if (token !== previewToken) return;
        var step = sequence[i % sequence.length];
        var groups = angleGroupsOverride(currentAngle.video, step.groups);
        var duration = Math.max(150, step.delay);
        return Rig.tweenTo(current, step.pose, duration, groups, function(){
          drawFrameToPreviewCanvas();
        }).then(function(){
          current = step.pose;
          i++;
          if (token !== previewToken) return;
          return next();
        });
      }
      return next();
    }
    function previewPlay(){
      if (!sequence.length){ toast('No steps recorded yet'); return; }
      previewPlaying = true;
      previewToken++;
      var token = previewToken;
      document.getElementById('preview-play').disabled = true;
      document.getElementById('preview-pause').disabled = false;
      runSmoothPreview(token);
    }
    function previewStop(){
      previewPlaying = false;
      previewToken++;
      document.getElementById('preview-play').disabled = false;
      document.getElementById('preview-pause').disabled = true;
    }
    document.getElementById('preview-play').addEventListener('click', previewPlay);
    document.getElementById('preview-pause').addEventListener('click', previewStop);

    function openPreview(){
      if (!sequence.length){ toast('Save at least one position before previewing'); return; }
      stopPlayback();
      gestureSaved = false;
      saveGestureBtn.disabled = false;
      savePublishBtn.disabled = false;
      overlay.classList.add('open');
      renderStepList(previewSeqListEl, null);
      refreshImagePreview();
      Rig.applyPose(sequence[0].pose, { silent: true });
      Rig.frameForGroups(sequence[0].groups).then(function(){ drawFrameToPreviewCanvas(); });
    }
    function closePreview(){
      previewStop();
      overlay.classList.remove('open');
    }
    document.getElementById('preview-cancel').addEventListener('click', closePreview);

    function buildGestureRecord(published){
      var suggested = loadedGestureName
        ? loadedGestureName + ' (edited)'
        : 'Custom gesture ' + (Date.now() % 10000);
      var name = window.prompt('Name this gesture. This is what you will say to Zippy.\nSeparate several names with commas (e.g. spiderman, cool, yo):', suggested);
      if (!name) return null;
      return {
        id: 'g_' + Date.now(),
        name: name,
        videoMode: VIDEO_MODE,
        coverImage: previewImg.src || (sequence[0] && sequence[0].image),
        sequence: sequence.map(function(s){
          return { name: s.name, pose: s.pose, groups: s.groups, image: s.image, delay: s.delay, isGroup: !!s.isGroup };
        }),
        published: !!published,
        createdAt: Date.now()
      };
    }

    function persistGesture(record){
      try{
        record.publisherEmail = (window.__zippyAccount && window.__zippyAccount.email) || null;
        record.publisherName  = (window.__zippyAccount && window.__zippyAccount.name) || 'You';
        window.parent.postMessage({ type: 'zippy:save', record: record }, '*');
        return true;
      }catch(e){
        console.error(e);
        return false;
      }
    }

    var gestureSaved = false;
    var saveGestureBtn = document.getElementById('preview-save-gesture');
    var savePublishBtn = document.getElementById('preview-save-publish');
    function saveGesture(published){
      if (gestureSaved) return;
      var record = buildGestureRecord(published);
      if (!record) return;
      gestureSaved = true;
      saveGestureBtn.disabled = true;
      savePublishBtn.disabled = true;
      if (persistGesture(record)){
        toast(published ? 'Gesture saved and published to the library' : 'Gesture saved');
        setTimeout(function(){ window.parent.postMessage({ type: 'zippy:done' }, '*'); }, 900);
      } else {
        toast('Could not save gesture on this device');
        gestureSaved = false;
        saveGestureBtn.disabled = false;
        savePublishBtn.disabled = false;
      }
    }

    document.getElementById('save-gesture-top').addEventListener('click', openPreview);
    saveGestureBtn.addEventListener('click', function(){ saveGesture(false); });
    savePublishBtn.addEventListener('click', function(){ saveGesture(true); });
  });
})();

      try{await send(steps[i].pose);if(first){first=false;res({ok:true,label})}}
      catch(e){const m='Not sent: '+((e&&e.message)||e);if(first){first=false;res({ok:false,label,reason:m})}else toast(m);return}
      const d=Math.round((steps[i].d||0)*speedMul);

    const f0=c01((base[id]-u[0])/(u[1]-u[0])),f1=c01(f0+dir*pct/100);
    return{steps:[st({[id]:u[0]+(u[1]-u[0])*f1})],label:lab+' \u2192 '+Math.round(f1*100)+'%'};
  }};
  return{cmd,n:1,spd:1,score:.99};
}
function single(A){
  const rr=rel(A);if(rr)return rr;
  const {cands,C}=strip(A);let c;
  for(const x of cands)if(c=exact(x))return{cmd:c,n:1,spd:1,score:.99};
  let n=1,spd=1,D=C;
  const tm=/\b(\d{1,2}|one|two|three|four|five|six|seven|eight|nine|ten) times?\b|\b(once|twice)\b/.exec(D);
  if(tm){n=Math.min(10,/^\d/.test(tm[1]||'')?parseInt(tm[1],10):TIMES[tm[1]||tm[2]]);D=D.replace(tm[0],' ')}
  if(/\b(slowly|slow)\b/.test(D)){spd=1.8;D=D.replace(/\b(slowly|slow)\b/g,' ')}
  if(/\b(quickly|fast|rapidly|quick)\b/.test(D)){spd=.55;D=D.replace(/\b(quickly|fast|rapidly|quick)\b/g,' ')}
  D=D.replace(/\s+/g,' ').trim();
  if(D&&D!==C){for(const x of strip(D).cands)if(c=exact(x))return{cmd:c,n,spd,score:.99}}
  if(c=param(C))return{cmd:c,n:1,spd:1,score:.99};

  const target=D||C;
  const f=fuzzyExact(target);
  if(f)return{cmd:f.cmd,n,spd,score:f.score};

  /* Scan useful n-grams before fuzzy matching the entire sentence. */
  const tk=target.split(' ');
  for(let L=Math.min(5,tk.length);L>=1;L--)for(let s=0;s+L<=tk.length;s++){
    const ph=tk.slice(s,s+L).join(' ');
    if(L===1&&(LEAD.has(ph)||(ph.length<3&&tk.length>2)))continue;
    if(c=exact(ph))return{cmd:c,n,spd,score:.975};
    const f2=fuzzyExact(ph);if(f2)return{cmd:f2.cmd,n,spd,score:f2.score};
  }
  return null;
}
const CONN=/\s+(?:(?:and\s+)?(?:then|after that|afterwards|followed by|next)|and)\s+/;
const HOLD=/\b(?:in |at |with )?(?:the |that |this |current )?same (?:position|pose|place|spot)\b|\bin that (?:position|pose)\b|\bin place\b|\bthere\b|\bkeeping (?:it|that|the arm|position)\b|\bwhile holding\b/;
const HOLDG=new RegExp(HOLD.source,'g');
function partItem(p){
  const hold=HOLD.test(p),t=p.replace(HOLDG,' ').replace(/\s+/g,' ').trim();
  if(!t)return null;
  const r=single(t);if(r)r.hold=hold;return r;
}
function resolve(text){
  const A0=fix(norm(text)),A0Words=A0.split(' ').filter(Boolean),A=A0Words.filter(w=>!WAKE.has(w)).join(' ');
  if(!A)return{wakeOnly:!!A0,items:[],score:1};
  const wakeHeard=A0!==A;
  const ex=strip(A).cands.map(exact).find(Boolean);
  if(ex)return{items:[{cmd:ex,n:1,spd:1,score:.99}],score:.99};
  const parts=A.split(CONN);
  if(parts.length>1){const items=parts.map(partItem);if(items.every(Boolean))return{items,score:Math.min(...items.map(x=>x.score||.8))}}
  const r=single(A);if(r)return{items:[r],score:r.score||.99};
  const pad=' '+A+' ';
  for(const e of LIST){if(e.sq.length>=4&&pad.includes(' '+e.a+' ')){
    const tm=/\b(\d{1,2}|two|three|four|five) times\b|\b(twice)\b/.exec(A);
    return{items:[{cmd:e.cmd,n:tm?Math.min(10,/^\d/.test(tm[1]||'')?parseInt(tm[1],10):TIMES[tm[1]||tm[2]]):1,spd:/\bslow/.test(A)?1.8:/\b(fast|quick)/.test(A)?.55:1}],score:.985}}}
  /* n-gram fallback: find a command phrase anywhere in the sentence */
  const tk=A.split(' ');
  for(let L=Math.min(5,tk.length);L>=1;L--)for(let s=0;s+L<=tk.length;s++){
    const ph=tk.slice(s,s+L).join(' ');
    if(L===1&&(LEAD.has(ph)||(ph.length<3&&tk.length>2)))continue;
    const c=exact(ph);if(c)return{items:[{cmd:c,n:1,spd:1}],score:.975};
  }
  return{items:[],wakeOnly:wakeHeard&&A.split(' ').every(w=>LEAD.has(w)),score:0};
}

async function handleSpeech(text,alts){
  const candidates=[text,...(Array.isArray(alts)?alts:[])].map(x=>norm(x)).filter(Boolean);
  const uniq=[...new Set(candidates)];
  let r={items:[],score:0,wakeOnly:false};
  uniq.forEach((candidate,index)=>{
    const x=resolve(candidate);
    if(x.items&&x.items.length){
      const score=(x.score||.8)-(index*.004);
      if(score>(r.score||0))r=Object.assign({},x,{score});
    }
  });
  if(!r.items.length)return r.wakeOnly?{ok:true,label:'Listening \u2013 say a gesture'}:{ok:false,reason:'Heard \u201c'+text+'\u201d \u2013 not a known command'};
  let steps=[],labels=[];
  const cur={},ARMJ=['wrist-slider','arm-slider','shoulder-slider','abduction-slider','extend-slider'];let prevCat='';
  for(const it of r.items){
    let s=it.cmd.steps,label=it.cmd.label||it.cmd.names[0];
    if(it.cmd.fn){const o=it.cmd.fn({hold:!!it.hold,cur:Object.assign({},cur)})||{};if(o.err){toast(o.err);return{ok:false,reason:o.err}}if(o.label)label=o.label;s=o.steps||[]}
    if(s.length>1&&it.n>1){const rep=[];for(let k=0;k<it.n;k++)s.forEach(x=>rep.push(x));s=rep;label+=' \u00d7'+it.n}
    if(it.hold&&!it.cmd.fn)s=s.map(x=>{const np=Object.assign({},x.pose);ARMJ.forEach(j=>{if(cur[j]!=null)np[j]=cur[j]});return{pose:np,d:x.d}});
    s=s.map(x=>({pose:x.pose,d:x.d*it.spd}));
    if(steps.length&&s.length)steps[steps.length-1].d=Math.max(steps[steps.length-1].d||0,(prevCat==='Joint'||prevCat==='Arm')?1500:650);
    s.forEach(x=>Object.assign(cur,x.pose));if(s.length)prevCat=it.cmd.cat;
    steps=steps.concat(s);labels.push(label);
  }
  const label=labels.join(' \u2192 ');
  toast(label);
  if(!steps.length)return{ok:true,label};
  lastRun={steps,label};
  return play(steps,label);
}
async function runName(name){const r=await handleSpeech(name);if(!r.ok)toast(r.reason||'Failed');return r}

const ov=document.createElement('div');ov.id='zvCreatorOverlay';

function onSaved(rec){
  if(!rec||!Array.isArray(rec.sequence))return;

  const seq=rec.sequence.filter(s=>s&&s.pose).map(s=>{const p={};Object.keys(FIELD).forEach(id=>{const v=+s.pose[id];if(s.pose[id]!=null&&isFinite(v))p[id]=v});return{name:s.name||'',pose:p,delay:Math.max(0,+s.delay||0)}});
